[project]
name = "indian-market-trend-ai"
version = "1.0.0"
description = "Indian-market next-candle prediction and validation platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.2",
  "pandas>=2.2.2",
  "numpy>=2.1.1",
  "scikit-learn>=1.5.2",
  "xgboost>=2.1.1",
  "httpx>=0.27.2",
  "apscheduler>=3.10.4",
  "python-json-logger>=2.0.7",
  "tenacity>=9.0.0",
  "exchange-calendars>=4.5.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.5",
  "mypy>=1.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
